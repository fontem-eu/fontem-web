<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 128">
  <!--
    Decorative lavender sprig — sits in the bottom-right of the page
    behind everything else (z-index 0, position: fixed) at low
    opacity, picked up by main.css. Uses currentColor on stem +
    buds so the page-level `color` token in main.css can drive both
    light and dark variants without two separate assets.
  -->
  <g stroke="currentColor" stroke-linecap="round" fill="none" stroke-width="1.8" opacity="0.85">
    <!-- Stem: starts at base of bud cluster (y=44), curves slightly
         right to suggest stem flex, ends near the bottom of the
         viewBox -->
    <path d="M32 44 Q34 80 31 120"/>
    <!-- Two leaves further down, mirrored -->
    <path d="M32 76 q-9 -3 -14 -10"/>
    <path d="M32 80 q9 -3 14 -10"/>
    <path d="M31 100 q-7 -3 -11 -8"/>
    <path d="M31 104 q7 -3 11 -8"/>
  </g>

  <!-- Bud cluster — fill: currentColor so they share the page tone.
       Slightly larger than the favicon's cluster to keep proportion
       with the bigger viewBox. -->
  <g fill="currentColor" opacity="0.9">
    <circle cx="32"   cy="6"   r="3.2"/>
    <circle cx="26.5" cy="11"  r="3.4"/>
    <circle cx="37.5" cy="11"  r="3.4"/>
    <circle cx="32"   cy="16"  r="3.6"/>
    <circle cx="26.2" cy="21"  r="3.6"/>
    <circle cx="37.8" cy="21"  r="3.6"/>
    <circle cx="32"   cy="26"  r="3.4"/>
    <circle cx="28"   cy="31"  r="3.2"/>
    <circle cx="36"   cy="31"  r="3.2"/>
    <circle cx="32"   cy="36"  r="3.0"/>
    <circle cx="30"   cy="40.5" r="2.4"/>
    <circle cx="34"   cy="40.5" r="2.4"/>
  </g>
</svg>
