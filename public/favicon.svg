<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Fontem favicon - Ariadne's Labyrinth. Four lapis walls form a
    unicursal maze (one path, no dead ends): the tangle of shells and
    intermediaries. A single gold thread - Ariadne's, the method a
    woman gave for escaping the maze - runs from the source at the
    centre out to the world, beaded with tesserae of the eight hues
    (records found as you follow the money), onyx and umber drawing
    stones woven in. Truth has one route. Dark chrome lifts the walls
    and gold-rims the drawing stones. In varietate concordia.
  -->
