<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <style>
    .bg { fill: #0d0d0d; }
    @media (prefers-color-scheme: light) { .bg { fill: #f0f0f0; } }
  </style>

  <!-- Container -->
  <rect class="bg" width="32" height="32" rx="6"/>

  <!-- Three ascending bars, bottom-aligned at y=29           -->
  <!-- Heights: 6 → 13 → 22  (roughly ×2 each step)          -->
  <!-- Opacity: 0.38 → 0.65 → 1.0  (fade = depth + recency)  -->
  <rect x="4"  y="23" width="6" height="6"  rx="1.5" fill="#22c55e" opacity="0.38"/>
  <rect x="13" y="16" width="6" height="13" rx="1.5" fill="#22c55e" opacity="0.65"/>
  <rect x="22" y="7"  width="6" height="22" rx="1.5" fill="#22c55e"/>
</svg>
