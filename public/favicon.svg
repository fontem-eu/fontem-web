<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Fontem favicon — a droplet ("source") rising above two pool
    ripples ("reflection"). The two-tone scheme mirrors the wordmark:
    indigo for the source, rose for the reflection.

    Background inverts with the OS preferred colour scheme so the
    favicon stays legible in both browser-tab backgrounds.
  -->
  <style>
    .bg { fill: #ffffff; }
    .drop { fill: #4f46e5; }
    .pool { fill: #b45a7a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; }
      .drop { fill: #818cf8; }
      .pool { fill: #f472b6; }
    }
  </style>

  <rect class="bg" width="32" height="32" rx="6"/>

  <!-- Droplet — teardrop shape, point up, base down. Centered on x=16. -->
  <path
    class="drop"
    d="M16 5 C16 5 10 12 10 17 A6 6 0 0 0 22 17 C22 12 16 5 16 5 Z"
  />

  <!-- Pool ripples — two short horizontal bars below the drop -->
  <rect class="pool" x="7"  y="24" width="8" height="2" rx="1"/>
  <rect class="pool" x="17" y="24" width="8" height="2" rx="1"/>
</svg>
