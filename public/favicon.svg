<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Fontem favicon — a droplet ("source") above two pool ripples
    ("reflection"). The two-tone colour scheme mirrors the wordmark:
    rose drop, plum pool.

    Background inverts with the OS preferred colour scheme so the
    favicon stays legible against both light and dark browser chrome.
  -->
  <style>
    .bg { fill: #faf3e6; }                       /* linen */
    .drop { fill: #b45a7a; }                     /* rose */
    .pool { fill: #6b4f8f; }                     /* plum */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14100c; }                     /* espresso */
      .drop { fill: #d48aa8; }                   /* rose (lifted) */
      .pool { fill: #c1a6d9; }                   /* lavender */
    }
  </style>

  <rect class="bg" width="32" height="32" rx="6"/>

  <!-- Droplet — teardrop shape, point up, base down. Centered on x=16. -->
  <path
    class="drop"
    d="M16 5 C16 5 10 12 10 17 A6 6 0 0 0 22 17 C22 12 16 5 16 5 Z"
  />

  <!-- Pool ripples — two short horizontal bars below the drop -->
  <rect class="pool" x="7"  y="24" width="8" height="2" rx="1"/>
  <rect class="pool" x="17" y="24" width="8" height="2" rx="1"/>
</svg>
