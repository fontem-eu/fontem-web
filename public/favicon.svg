<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Fontem favicon — the Mosaic Spring. Tesserae of the platform's
    eight categorical hues radiate in rings from a gold source-point
    (fontem = the spring). Onyx and umber "drawing stones" are woven
    through the ring: in the mosaic craft the dark stones draw the
    figure — the mark doesn't hold together without them, which is
    the point. In dark chrome the drawing stones take a thin gold-
    glass rim (the Byzantine trick) so the drawing stays legible.
    In varietate concordia.
  -->
  <style>
    .bg   { fill: #faf3e6; }                     /* linen */
    .draw { stroke: none; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #1f1827; }                   /* dusk */
      .draw { stroke: #c9a227; stroke-width: 0.9; }
    }
  </style>
