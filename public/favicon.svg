<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Fontem favicon — the Spun Thread. A single thread unspools from a
    gold source-point (fontem, the spring) and spirals out, beaded with
    tesserae of the platform's eight categorical hues: each bead a
    record strung on the line you follow (follow the money). Onyx and
    umber drawing stones are woven through — the dark stones draw the
    figure. The spiral is the spindle-whorl and the spun thread of the
    Fates: following a thread, and spinning it, are the oldest women's
    knowledge in Europe. On dark chrome the thread lifts and the drawing
    stones take a gold-glass rim. In varietate concordia.
  -->
  <style>
    .mm-bg{fill:#faf3e6}
    .mm-thread{stroke:#1d4e9e}
    .mm-ring{stroke:#1d4e9e}
    @media (prefers-color-scheme:dark){
      .mm-bg{fill:#1f1827}
      .mm-thread{stroke:#8fb0ea}
      .mm-ring{stroke:#8fb0ea}
      .mm-draw{stroke:#c9a227;stroke-width:0.6}
    }
  </style>
