<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Fontem favicon — the Mosaic of Europe. Tesserae of the platform's
    eight categorical hues tile the silhouette of the continent, built
    from Fontem's own NUTS-0 boundary data. Onyx and umber "drawing
    stones" are woven through — in the mosaic craft the dark stones
    draw the figure, so it doesn't hold together without them (and
    neither does Europe). A single gold tessera near the centre is the
    source — fontem, the spring. On dark chrome the drawing stones take
    a gold-glass rim. In varietate concordia.
  -->
  <style>
    .mm-bg{fill:#faf3e6}
    @media (prefers-color-scheme: dark){
      .mm-bg{fill:#1f1827}
      .mm-draw{stroke:#c9a227;stroke-width:0.5}
    }
  </style>
  <rect class="mm-bg" width="64" height="64" rx="12"/>
  
