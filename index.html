<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontem — Follow the numbers, verify the claims</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <meta name="theme-color" content="#0d1117"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="description" content="Fontem — the primary-source transparency platform. EU companies, public procurement, lobbyists, and cohesion funding, linked into one graph and cross-checked against the official registers."/>
    <!-- Anti-FOUC: apply theme class before first paint.
         Two themes: 'light' (default, no class) and 'dark'.
         Legacy 'autumn' persists as 'light' via migration on init. -->
    <script>
      ;(function () {
        var saved = localStorage.getItem('gmr-theme')
        if (saved === 'dark') {
          document.documentElement.classList.add('dark')
          return
        }
        // 'light' and legacy 'autumn' both render as the new warm light.
        if (saved === 'light' || saved === 'autumn') return
        if (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!--
      Runtime analytics config — mounted as a ConfigMap by Kubernetes.
      Sets window.UMAMI_WEBSITE_ID before the app boots.
      Silently ignored in local dev (file does not exist).
    -->
    <script src="/umami-config.js" onerror="void(0)"></script>
    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
