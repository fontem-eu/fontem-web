<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values. Without it those insets are always 0, so bottom-anchored
         controls sit underneath the Android gesture bar and the iOS home
         indicator and cannot be tapped. Everything fixed to an edge pads
         itself with the matching inset — see .assist-toggle, .rail, .ccb. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--ssr-head-->
    <title>Fontem — Argue it. With data. Together.</title>
    <meta name="description" content="Crossing the EU's digital borders, one dataset at a time. Fontem links EU companies, public procurement, legislation, lobbyists, petitions and cohesion funding into one graph, cross-checked against the official registers."/>
    <!--/ssr-head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=laby3"/>
    <link rel="manifest" href="/manifest.json?v=laby3"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.f890d7cc.png"/>
    <meta name="theme-color" content="#1d4e9e"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <!-- Host-stable OpenGraph values. Per-route og:title, og:description,
         og:url, og:image come from the SSR head block above, anchored to
         whatever host the request came in on — so link previews work on
         fontem.eu, www.fontem.eu, gmr.void42.net, or any staging domain
         without re-building the bundle. -->
    <meta property="og:site_name" content="Fontem"/>
    <meta property="og:type" content="website"/>
    <meta property="og:locale" content="en_EU"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <!-- Anti-FOUC: apply theme class before first paint.
         Two themes: 'light' (default, no class) and 'dark'.
         Legacy 'autumn' persists as 'light' via migration on init. -->
    <script>
      ;(function () {
        if (typeof localStorage === 'undefined') return
        var saved = localStorage.getItem('gmr-theme')
        if (saved === 'dark') {
          document.documentElement.classList.add('dark')
          return
        }
        if (saved === 'light' || saved === 'autumn') return
        if (window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!-- Anti-FOUC for <html lang>: set the attribute before first paint
         so screen readers + SEO see the user's chosen language from
         render #1. Normalised against the 24 EU codes; unknown → 'en'. -->
    <script>
      ;(function () {
        if (typeof localStorage === 'undefined') return
        var codes = 'bg,cs,da,de,el,en,es,et,fi,fr,ga,hr,hu,it,lt,lv,mt,nl,pl,pt,ro,sk,sl,sv'.split(',')
        function norm(v) {
          if (!v || typeof v !== 'string') return null
          var c = v.trim().slice(0, 2).toLowerCase()
          return codes.indexOf(c) >= 0 ? c : null
        }
        var lang = norm(localStorage.getItem('gmr-lang'))
                || (typeof navigator !== 'undefined' && norm(navigator.language))
                || 'en'
        document.documentElement.lang = lang
      })()
    </script>
    <!--
      Runtime analytics config — mounted as a ConfigMap by Kubernetes.
      Sets window.UMAMI_WEBSITE_ID before the app boots.
      Silently ignored in local dev (file does not exist).
    -->
    <script src="/umami-config.js"></script>
    <!-- Runtime, per-deployment tuning of the article-quality heuristics.
         Sets window.__QUALITY_CONFIG__ before the app boots. -->
    <script src="/quality-config.js"></script>
    <!-- Google Identity Services (Sign in with Google) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
