<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMR — EU Enterprise Knowledge Graph</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <!-- Anti-FOUC: apply theme class before first paint -->
    <script>
      ;(function () {
        var saved = localStorage.getItem('gmr-theme')
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!--
      Runtime analytics config — mounted as a ConfigMap by Kubernetes.
      Sets window.UMAMI_WEBSITE_ID before the app boots.
      Silently ignored in local dev (file does not exist).
    -->
    <script src="/umami-config.js" onerror="void(0)"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
