# Rate limiting zones — loaded in http{} block before server{} blocks.
#
# Two tiers:
#   1. Burst: 120 requests/minute (2 req/s) per client IP
#   2. Sustained: 600 requests/10 minutes (1 req/s) per client IP
#
# Uses $http_x_forwarded_for (real client IP from Traefik) with fallback
# to $remote_addr. The 10m zone holds ~160k IP addresses.

map $http_x_forwarded_for $rate_limit_key {
    default   $http_x_forwarded_for;
    ""        $remote_addr;
}

# Tier 1: burst protection — 2 req/s = 120 req/min
limit_req_zone $rate_limit_key zone=burst:10m rate=2r/s;

# Tier 2: sustained protection — 1 req/s = 600 req/10min
limit_req_zone $rate_limit_key zone=sustained:10m rate=1r/s;

# Return 429 instead of 503 when rate limited
limit_req_status 429;

# Don't log rate-limited requests at error level (they're expected)
limit_req_log_level warn;
