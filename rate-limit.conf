# Rate limiting zones — loaded in http{} block before server{} blocks.
#
# Two tiers:
#   1. Burst: 600 requests/minute (10 req/s) per client IP
#   2. Sustained: 1800 requests/10 minutes (3 req/s) per client IP
#
# Original tuning (2 req/s burst + 1 req/s sustained) assumed a thin
# "one user, one page" load profile. Real traffic — and especially
# the smoke suite — fires 30-50 requests inside a couple of seconds
# during page loads (TickerFinancials + DataViewSelector + GraphExplorer
# + EntityNutsMap each pull multiple endpoints in parallel). At 2r/s
# the burst budget drained partway through the suite and the next
# /api/geo/entity/.../aggregate request 429'd, taking out BROWSE-09.
# The new ceiling still throttles a real abuser (10r/s + the per-route
# slowapi limits on /capi/auth/* are the brute-force gate) but lets the
# legitimate SPA burst land without artificial 429s.
#
# Uses $http_x_forwarded_for (real client IP from Traefik) with fallback
# to $remote_addr. The 10m zone holds ~160k IP addresses.

map $http_x_forwarded_for $rate_limit_key {
    default   $http_x_forwarded_for;
    ""        $remote_addr;
}

# Tier 1: burst protection — 10 req/s = 600 req/min
limit_req_zone $rate_limit_key zone=burst:10m rate=10r/s;

# Tier 2: sustained protection — 3 req/s = 1800 req/10min
limit_req_zone $rate_limit_key zone=sustained:10m rate=3r/s;

# Return 429 instead of 503 when rate limited
limit_req_status 429;

# Don't log rate-limited requests at error level (they're expected)
limit_req_log_level warn;
