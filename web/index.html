<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMR — Ticker Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --accent:   #58a6ff;
      --accent2:  #3fb950;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --danger:   #f85149;
      --radius:   8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 1rem 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header h1 span { color: var(--accent); }

    header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search-wrap {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--accent); }

    #status {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
      text-align: right;
    }

    #results {
      width: 100%;
      max-width: 600px;
      margin-top: 0.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .ticker-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .ticker-symbol {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 60px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .ticker-info {
      flex: 1;
      min-width: 0;
    }

    .ticker-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticker-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-active   { background: rgba(63,185,80,0.15); color: var(--accent2); }
    .badge-inactive { background: rgba(248,81,73,0.15); color: var(--danger); }
    .badge-exchange { background: rgba(88,166,255,0.1); color: var(--accent); }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: var(--muted);
    }

    .empty-state svg { margin-bottom: 0.75rem; opacity: 0.4; }
    .empty-state p   { font-size: 0.9rem; }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1><span>GMR</span> Ticker Search</h1>
    <p>Search across 10,000+ SEC EDGAR-registered companies</p>
  </header>

  <div class="search-wrap">
    <!-- search icon -->
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
    </svg>
    <input
      id="search"
      type="search"
      placeholder="Search by ticker or company name…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Ticker search"
    />
  </div>
  <div id="status"></div>

  <div id="results" role="list" aria-live="polite" aria-label="Search results"></div>

  <footer>Data sourced from SEC EDGAR</footer>

  <script>
    const searchInput = document.getElementById('search');
    const resultsEl   = document.getElementById('results');
    const statusEl    = document.getElementById('status');

    let debounceTimer = null;
    let currentQuery  = '';

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim();
      clearTimeout(debounceTimer);

      if (!q) {
        resultsEl.innerHTML = '';
        statusEl.textContent = '';
        return;
      }

      statusEl.textContent = 'Searching…';
      debounceTimer = setTimeout(() => fetchTickers(q), 280);
    });

    async function fetchTickers(query) {
      currentQuery = query;
      try {
        const url = `/api/tickers/search?query=${encodeURIComponent(query)}&limit=10`;
        const res  = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Discard stale responses
        if (query !== currentQuery) return;

        renderResults(data);
      } catch (err) {
        if (query !== currentQuery) return;
        statusEl.textContent = 'Error fetching results.';
        resultsEl.innerHTML = '';
        console.error(err);
      }
    }

    function renderResults(data) {
      statusEl.textContent = data.count > 0
        ? `${data.count} result${data.count !== 1 ? 's' : ''} — ${data.total_available.toLocaleString()} total tickers`
        : '';

      if (data.results.length === 0) {
        resultsEl.innerHTML = `
          <div class="empty-state">
            <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.156a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
            </svg>
            <p>No tickers found for "<strong>${escHtml(data.query)}</strong>"</p>
          </div>`;
        return;
      }

      resultsEl.innerHTML = data.results.map(t => {
        const meta = [t.exchange, t.country, t.sector !== 'Unknown' ? t.sector : null]
          .filter(Boolean).join(' · ');
        const activeBadge = t.is_active
          ? `<span class="badge badge-active">Active</span>`
          : `<span class="badge badge-inactive">Inactive</span>`;
        const exchangeBadge = t.exchange
          ? `<span class="badge badge-exchange">${escHtml(t.exchange)}</span>`
          : '';

        return `
          <div class="ticker-card" role="listitem">
            <span class="ticker-symbol">${escHtml(t.symbol)}</span>
            <div class="ticker-info">
              <div class="ticker-name">${escHtml(t.name)}</div>
              ${meta ? `<div class="ticker-meta">${escHtml(meta)}</div>` : ''}
            </div>
            ${exchangeBadge}
            ${activeBadge}
          </div>`;
      }).join('');
    }

    function escHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
