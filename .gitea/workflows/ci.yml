name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npx vitest run --dangerouslyIgnoreUnhandledErrors
      - name: Run linter
        run: npm run lint

  # Pre-build supply-chain gate. Runs in parallel with `test` — failing
  # on High+ CVEs in package-lock.json blocks the merge before any image
  # gets built or signed. Uses the shared gmr-ci action so the threshold
  # and scanner version are controlled in one place across all repos.
  #
  # We check out gmr-ci into `.gmr-ci/` and invoke the action via a
  # local path — act_runner v0.3.1 doesn't resolve URL-prefixed `uses:`
  # against the cluster-internal Gitea, but `./path` resolves locally.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.gmr-ci/actions/osv-scan

  # Build the shipped image and probe it on every PR. Catches the class
  # of bugs that slipped past unit tests in the SSR era: port/plumbing
  # mismatches, missing static assets (og-card.png shipped as 404),
  # nginx config that fails to start, and prerender script failures
  # (since `npm run build` runs prerender and the docker build will
  # fail if it throws).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Build image
        run: docker build --network host -t gmr-web:smoke .
      - name: Run container
        # Bind host 8080 → container 80. If the image ever stops
        # listening on 80 (the SSR port-mismatch that broke staging),
        # the readiness probe below fails and the job errors out.
        run: docker run -d --name gmr-web-smoke -p 8080:80 gmr-web:smoke
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become ready"
          docker logs gmr-web-smoke
          exit 1
      - name: Probe prerendered routes
        # Every route we advertise as prerendered must return 200 with
        # its route-specific <title>. A plain-SPA fallback would serve
        # the generic shell title, which we'd catch here.
        run: |
          set -e
          probe() {
            local path="$1"
            local expect="$2"
            local body
            body=$(curl -fsS "http://localhost:8080$path")
            if ! grep -q "<title>$expect" <<<"$body"; then
              echo "FAIL $path: missing title containing '$expect'"
              echo "$body" | grep -oE '<title>[^<]*' | head -1
              exit 1
            fi
            echo "OK   $path — $expect"
          }
          probe /              "Fontem"
          probe /feed          "Feed"
          probe /privacy       "Privacy"
          probe /data-quality  "Data quality"
          probe /sparql        "SPARQL"
      - name: Probe critical static assets
        # og-card.png + robots.txt ship as real files in public/. If
        # they disappear (the og-card.png 404 that broke WhatsApp
        # previews) this flags it before prod.
        run: |
          set -e
          check() {
            local path="$1"
            local min_bytes="$2"
            local bytes
            bytes=$(curl -fsS -o /dev/null -w '%{size_download}' "http://localhost:8080$path")
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "FAIL $path: $bytes bytes (< $min_bytes)"
              exit 1
            fi
            echo "OK   $path — $bytes bytes"
          }
          check /og-card.png  1000
          check /robots.txt   100
      - name: Stop container
        if: always()
        run: docker rm -f gmr-web-smoke

  analyze:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and generate coverage
        run: npm ci && npx vitest run --dangerouslyIgnoreUnhandledErrors --coverage
      - uses: actions/checkout@v4
        with:
          repository: golden/gmr-ci
          path: .gmr-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: SonarQube scan
        run: |
          npx sonarqube-scanner -Dsonar.host.url=http://sonarqube.sonarqube.svc.cluster.local:9000 -Dsonar.token=${{ secrets.SONAR_TOKEN }}
      - name: Generate + upload SBOM
        uses: ./.gmr-ci/actions/sbom-generate
        with:
          language: node
          project-name: gmr-web
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

  build-deploy:
    needs: [test, smoke, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Build and push image
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build --network host -t gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-web:$TAG .
          docker push gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-web:$TAG
      - name: Sign image with Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-web:$TAG
          rm /tmp/cosign.key
      - name: Deploy to staging
        run: |
          git clone --depth=1 http://oauth2:${{ secrets.REGISTRY_PASSWORD }}@gitea-http.dev-tools.svc.cluster.local:3000/golden/gitops.git /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'$TAG'"/' staging/gmr-web.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add staging/gmr-web.yaml
          git diff --cached --quiet || git commit -m "ci: deploy gmr-web $TAG to staging"
          git push origin main
