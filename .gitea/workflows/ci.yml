name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npx vitest run --dangerouslyIgnoreUnhandledErrors
      - name: Run linter
        run: npm run lint

  # Pre-build supply-chain gate. Runs in parallel with `test` — failing
  # on High+ CVEs in package-lock.json blocks the merge before any image
  # gets built or signed. Uses the shared gmr-ci action so the threshold
  # and scanner version are controlled in one place across all repos.
  #
  # We check out gmr-ci into `.fontem-ci/` and invoke the action via a
  # local path — act_runner v0.3.1 doesn't resolve URL-prefixed `uses:`
  # against the cluster-internal Gitea, but `./path` resolves locally.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.fontem-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.fontem-ci/actions/secret-scan

  # Build the shipped image and probe it on every PR. Catches the class
  # of bugs that slipped past unit tests in the SSR era: port/plumbing
  # mismatches, missing static assets (og-card.png shipped as 404),
  # nginx config that fails to start, and prerender script failures
  # (since `npm run build` runs prerender and the docker build will
  # fail if it throws).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --network host -t fontem-web:smoke .
      - name: Run container
        # Bind host 8080 → container 80. If the image ever stops
        # listening on 80 (the SSR port-mismatch that broke staging),
        # the readiness probe below fails and the job errors out.
        run: docker run -d --name fontem-web-smoke -p 8080:80 fontem-web:smoke
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become ready"
          docker logs fontem-web-smoke
          exit 1
      - name: Probe prerendered routes
        # Every route we advertise as prerendered must return 200 with
        # its route-specific <title>. A plain-SPA fallback would serve
        # the generic shell title, which we'd catch here.
        run: |
          set -e
          probe() {
            local path="$1"
            local expect="$2"
            local body
            body=$(curl -fsS "http://localhost:8080$path")
            if ! grep -q "<title>$expect" <<<"$body"; then
              echo "FAIL $path: missing title containing '$expect'"
              echo "$body" | grep -oE '<title>[^<]*' | head -1
              exit 1
            fi
            echo "OK   $path — $expect"
          }
          probe /              "Fontem"
          probe /about         "About"
          probe /privacy       "Privacy"
          probe /data-quality  "Data quality"
          probe /sparql        "SPARQL"
          probe /donate        "Support"

          # /about is the new home of the carousel + chips + how-it-
          # works strip. If `data-testid="example-chips"` disappears
          # there, the marketing page silently regressed.
          body=$(curl -fsS "http://localhost:8080/about")
          if ! grep -q 'data-testid="example-chips"' <<<"$body"; then
            echo "FAIL /about: example-chips missing from prerendered HTML"
            exit 1
          fi
          echo "OK   /about  — example-chips present"

          # `/` is now the Feed listing — must SSR with the feed
          # container. (Anonymous body still works because Feed reads
          # public stories without auth.)
          body=$(curl -fsS "http://localhost:8080/")
          if ! grep -q 'data-testid="feed"' <<<"$body"; then
            echo "FAIL /: feed container missing from prerendered HTML"
            exit 1
          fi
          echo "OK   /  — feed container present"
      - name: Probe critical static assets
        # og-card.png + robots.txt ship as real files in public/. If
        # they disappear (the og-card.png 404 that broke WhatsApp
        # previews) this flags it before prod.
        run: |
          set -e
          check() {
            local path="$1"
            local min_bytes="$2"
            local bytes
            bytes=$(curl -fsS -o /dev/null -w '%{size_download}' "http://localhost:8080$path")
            if [ "$bytes" -lt "$min_bytes" ]; then
              echo "FAIL $path: $bytes bytes (< $min_bytes)"
              exit 1
            fi
            echo "OK   $path — $bytes bytes"
          }
          check /og-card.png       1000
          check /robots.txt         100
          check /landing-demo.mp4  500000
      - name: Stop container
        if: always()
        run: docker rm -f fontem-web-smoke

  analyze:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: Install dependencies and generate coverage
        run: npm ci && npx vitest run --dangerouslyIgnoreUnhandledErrors --coverage
      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Build → sign → attest the SBOM → deploy. SBOM generation moved
  # into this job (from the old `analyze` job) so the same file can
  # be both uploaded to Dependency-Track AND used as the attestation
  # predicate — one generate, one attest, one upload.
  build-deploy:
    needs: [test, smoke, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - name: Install deps (for cyclonedx-npm)
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.fontem-ci/actions/sbom-generate
        with:
          language: node
          project-name: fontem-web
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.fontem-ci/actions/docker-build-sign
        with:
          # Push via the cluster-internal Gitea URL over plaintext HTTP —
          # the same backend that contribute.void42.internal fronts.
          # Signatures are path-keyed in the repo, so Kyverno still finds
          # them when deployments reference the image by its HTTPS
          # hostname. PR #56 briefly flipped this to contribute.void42
          # .internal but dockerd 29.4's containerd-snapshotter image
          # path doesn't read /etc/docker/certs.d, so `docker login`
          # rejects the void42 private CA and the job dies on push.
          image: gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-web
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      # Inline gitops-bump. The shared action in void42/ci-actions
      # was rewritten for the void42-templates layout
      # (environments/<env>/image-tag.yaml) that doesn't match
      # fontem/gitops's testing/<svc>.yaml layout. Same shape as
      # the consolidator + sinks workflows.
      - name: Bump image tag in gitops/testing
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gitops
          git clone --depth=1 \
            "https://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'"$TAG"'"/' testing/fontem-web.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add testing/fontem-web.yaml
          if git diff --cached --quiet; then
            echo "No version change; skipping commit"
            exit 0
          fi
          git commit -m "ci: deploy fontem-web $TAG to testing"
          git push origin main
