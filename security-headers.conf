# Security response headers — single source of truth.
#
# nginx drops ALL inherited `add_header` directives the instant a location
# defines even one of its own. That rule is why CSP kept silently going
# missing on the static-asset, /uploads/ and MinIO locations (they repeated
# X-Frame/HSTS but forgot CSP) — the 2026-06-25 ZAP run flagged exactly that.
# Keeping every security header in one include, pulled into the server block
# AND every location with its own add_header, makes that drift impossible.
#
# CSP notes:
# - `style-src 'unsafe-inline'` — an accepted risk, but NOT for the reason
#   this note used to give. It claimed reactive `:style` bindings required it
#   and that 21 components would break. That is measurably wrong: Vue applies
#   `:style` through CSSOM (`el.style.setProperty`), which CSP does not
#   govern at all. Measured 2026-09-01 by serving the real app under
#   `style-src 'self'` (CSP rewritten in-flight, violations collected from
#   `securitypolicyviolation`): across /, /about, /login and /atlas the only
#   violations were our own STATIC `style="…"` attributes — which SSR emits
#   into the markup — and Google Sign-In's injected styles. Zero came from a
#   `:style` binding.
#
#   So the real blockers are:
#     1. 28 static `style="…"` attributes in templates (`:style` bindings are
#        fine — there are 39 of those and they are not the problem). Each has
#        to become a class before the keyword can go.
#     2. accounts.google.com/gsi/client, which injects a <style> element and
#        sets style attributes from its own script. We cannot nonce a
#        third-party script's injected styles, so while the Google button is
#        on /login the keyword stays regardless of what we do to (1).
#
#   The CSP3 split is still not the answer, for the reason recorded
#   2026-08-13: `style-src-attr 'unsafe-inline'` with a strict
#   `style-src-elem` covers exactly this case, but Firefox implements neither
#   and falls back to `style-src`, so shipping it would break the UI for
#   Firefox users.
#
#   Compensating controls: a strict `script-src` (no unsafe-inline, no
#   unsafe-eval, hashes only), DOMPurify on every v-html site, nosniff, and
#   a smoke test (CSP-1) that pins this header so a weakening cannot ride in
#   behind the DAST suppression for the per-URL noise this generates.
#   Documented accepted risk so pentests don't silently re-raise it.
# - `style-src https://accounts.google.com` — the Sign-in-with-Google button
#   loads its stylesheet from accounts.google.com/gsi/style. Without the host
#   the browser blocked it outright ("Loading the stylesheet … violates the
#   following Content-Security-Policy directive") and the button rendered
#   unstyled — measured against the dast environment on 2026-09-01, present
#   in every environment including production. `frame-src`, `script-src` and
#   `connect-src` already list the host; `style-src` was simply missed.
# - `img-src` — own origin + data:/blob: (GraphExplorer downloads) + OSM tiles
#   + the public apex/www origins of BOTH domains, because presigned MinIO
#   image URLs live on an apex and a user on the other host loads them
#   cross-origin (that mismatch silently blocked avatars — no server error).
#   dargle.eu is listed for the same reason fontem.eu is: it is served, and
#   the canonical now names it, so either can be the origin of an image URL
#   while the reader sits on the other.
# - `report-uri` — browser POSTs CSP violations to /capi/csp-report so this
#   class of client-side block is visible in the API logs.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Deny device/sensor features the app never uses (+ opt out of FLoC).
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
# HSTS: refuse HTTP for a year across subdomains. No `preload` yet.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-ghBENveJngLn9Cr1pnKkNzXsbVT0Qw5nK71Lgdl4di4=' 'sha256-nk6+eSE1SmIMntwwHFnjicuvmV8yOEZT0tUiER3S5TM=' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://fontem.eu https://www.fontem.eu https://dargle.eu https://www.dargle.eu; connect-src 'self' https://accounts.google.com https://tile.openstreetmap.org; font-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'self'; report-uri /capi/csp-report" always;
