# Security response headers — single source of truth.
#
# nginx drops ALL inherited `add_header` directives the instant a location
# defines even one of its own. That rule is why CSP kept silently going
# missing on the static-asset, /uploads/ and MinIO locations (they repeated
# X-Frame/HSTS but forgot CSP) — the 2026-06-25 ZAP run flagged exactly that.
# Keeping every security header in one include, pulled into the server block
# AND every location with its own add_header, makes that drift impossible.
#
# CSP notes:
# - `style-src 'unsafe-inline'` — required by Vue: reactive :style bindings and
#   the CSS-custom-property theming both count as inline styles. Removing it
#   would break the UI until every inline style becomes a class + CSS-var pair.
#   Documented accepted risk so pentests don't silently re-raise it.
# - `img-src` — own origin + data:/blob: (GraphExplorer downloads) + OSM tiles
#   + the public apex/www fontem.eu origins, because presigned MinIO image
#   URLs live on apex fontem.eu and a user on www.fontem.eu loads them
#   cross-origin (that mismatch silently blocked avatars — no server error).
# - `report-uri` — browser POSTs CSP violations to /capi/csp-report so this
#   class of client-side block is visible in the API logs.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Deny device/sensor features the app never uses (+ opt out of FLoC).
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
# HSTS: refuse HTTP for a year across subdomains. No `preload` yet.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-ghBENveJngLn9Cr1pnKkNzXsbVT0Qw5nK71Lgdl4di4=' 'sha256-nk6+eSE1SmIMntwwHFnjicuvmV8yOEZT0tUiER3S5TM=' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://fontem.eu https://www.fontem.eu; connect-src 'self' https://accounts.google.com https://tile.openstreetmap.org; font-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'self'; report-uri /capi/csp-report" always;
