[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
reason = """brace-expansion unbounded-expansion DoS. Fixed only in 5.0.8
(2026-07-23); no 1.x/2.x backport exists and 5.x's named-export API breaks
