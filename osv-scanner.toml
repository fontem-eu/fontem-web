# Scoped, documented ignores for the OSV lockfile gate (CI security job).
# Remove entries as upstream patches land.
#
# Empty on purpose. GHSA-mh99-v99m-4gvg (brace-expansion unbounded
# expansion) was ignored on the grounds that no 1.x/2.x backport existed
# and 5.x's named-export API broke CJS consumers. That entry said
# "revisit when upstream backports to 1.x/2.x", and they have: the tree
# now carries 1.1.18, 2.1.4 and 5.0.9, all patched. osv-scanner reported
# the ignore as unused, which is the signal to drop it — an ignore that
# matches nothing is a standing exemption for a vulnerability nobody is
# re-checking.
