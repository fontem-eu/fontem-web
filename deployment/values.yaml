version: "vbf141f7"
# Immutable digest pin (sha256:...). When set (CI writes it on deploy) the
# Deployment references the image by digest and `version` is used only for
# display/labels; empty falls back to the `version` tag.
digest: ""
domain: localhost
containerPort: 80   # 80 for the old nginx base; 8080 for the hardened nonroot Chainguard nginx
serviceType: ClusterIP
replicas: 1

# Runtime SSR for /stories/:id. Off by default: the routes fall back to
# the prerendered SPA shell, which is exactly what they served before SSR
# existed, so an environment that has not enabled this loses nothing it
# had. Enable per env in gitops, and set ssrUpstream on the web
# deployment in the same values file — one without the other is a no-op.
ssr:
  enabled: false
  replicas: 1
  version: ""            # falls back to the web image's `version`
  digest: ""             # CI writes this; digest is what cosign signed
  canonicalUrl: "https://dargle.eu"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "768Mi" }

# Where nginx proxies the story routes. Empty means "no SSR here" and the
# location serves the shell instead — see nginx.conf.
ssrUpstream: ""

# Default empty — environments without a value send no analytics
# (useAnalytics() no-ops on falsy ID). Only prod overrides this.
umamiWebsiteId: ""

# Article-quality heuristics (story editor). Tunable per-deployment with NO
# image rebuild: edit these + redeploy, the SPA reads window.__QUALITY_CONFIG__
# at page load. Omitted keys fall back to the code DEFAULTS.
qualityHeuristics:
  targetMinutes: 10          # ideal read length (min)
  targetTextDataRatio: 1.0   # prose-time / data-time; 1.0 == half and half
  minutesTolerance: 3        # +/- minutes still "on target" for suggestions
  ratioTolerance: 0.2        # +/- ratio still "balanced"
  wordsPerMinute: 238        # reading-speed model
  secondsPerPlot: 30         # time to interpret one data plot / table
