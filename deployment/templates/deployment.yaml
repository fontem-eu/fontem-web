apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fontem-web
  labels:
    app: fontem-web
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-web
  template:
    metadata:
      labels:
        app: fontem-web
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: nginx
          # Prefer a digest pin (immutable, matches exactly what CI signed);
          # fall back to the tag while an env's values still carry only
          # `version:` during the tag->digest transition.
          image: "contribute.void42.internal/fontem/fontem-web{{ if .Values.digest }}@{{ .Values.digest }}{{ else }}:{{ .Values.version }}{{ end }}"
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # MinIO upstream + bucket are env-specific:
            # - non-prod (staging/testing/dast): shared instance in
            #   fontem-shared, per-env bucket (fontem-{env})
            # - prod: own instance in fontem-prod, bucket fontem-uploads
            # Both default to fontem-prod (the prod posture) in the image;
            # non-prod values files override via gitops.
            - name: MINIO_NAMESPACE
              value: {{ .Values.minioNamespace | default "fontem-prod" | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minioBucket | default "fontem-uploads" | quote }}
          ports:
            - containerPort: {{ .Values.containerPort | default 80 }}
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: umami-config
              mountPath: /usr/share/nginx/html/umami-config.js
              subPath: umami-config.js
              readOnly: true
            - name: quality-config
              mountPath: /usr/share/nginx/html/quality-config.js
              subPath: quality-config.js
              readOnly: true
      volumes:
        - name: umami-config
          configMap:
            name: fontem-web-umami-config
        - name: quality-config
          configMap:
            name: fontem-web-quality-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
