---
# Runtime analytics configuration for Umami.
# Per-env website ID; empty in non-prod so useAnalytics() no-ops.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gmr-web-umami-config
  namespace: {{ .Release.Namespace }}
data:
  umami-config.js: |
    window.UMAMI_WEBSITE_ID = "{{ .Values.umamiWebsiteId }}";
