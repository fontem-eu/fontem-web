server {
    listen       80;
    server_name  _;

    # Hide nginx version from Server header
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers (OWASP ZAP findings) ───────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://accounts.google.com; font-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Community API proxy (resolver makes upstream resolution happen at request time,
    # not at startup — so nginx starts even if community-api isn't deployed yet)
    location ^~ /capi/ {
        limit_req zone=burst burst=30 nodelay;
        limit_req zone=sustained burst=60 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $capi_upstream http://gmr-community-api.${POD_NAMESPACE}.svc.cluster.local:8001;
        rewrite ^/capi/(.*)$ /$1 break;
        proxy_pass $capi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support for /assist/chat/stream
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # GMR API proxy — strip /api prefix before forwarding
    location ^~ /api/ {
        limit_req zone=burst burst=30 nodelay;
        limit_req zone=sustained burst=60 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $api_upstream http://gmr-api.${POD_NAMESPACE}.svc.cluster.local;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Image uploads — proxy to MinIO
    location ^~ /uploads/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $minio_upstream http://minio.${POD_NAMESPACE}.svc.cluster.local:9000;
        rewrite ^/uploads/(.*)$ /gmr-uploads/$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file is served as index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Umami event tracking endpoint
    location ^~ /umami/api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/umami/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
