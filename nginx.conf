server {
    listen       80;
    server_name  _;

    # Hide nginx version from Server header
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers (OWASP ZAP findings) ───────────────
    #
    # CSP notes:
    # - `style-src 'unsafe-inline'` — required by Vue. Reactive `:style`
    #   bindings and static `style=""` attributes (heavy use of CSS
    #   custom properties for theming) both count as inline styles to
    #   the browser. Removing unsafe-inline would break the UI until
    #   every inline style is migrated to a class + CSS-var pair.
    #   Accepted risk, documented so the next ZAP/pentest pass
    #   doesn't re-raise it silently.
    # - `img-src` — own origin + data URIs + blob: (GraphExplorer's
    #   createObjectURL download path) + OSM tiles for the map
    #   components. Dropped the previous `https:` wildcard that let
    #   any HTTPS origin serve images.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://accounts.google.com https://tile.openstreetmap.org; font-src 'self'; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Community API proxy (resolver makes upstream resolution happen at request time,
    # not at startup — so nginx starts even if community-api isn't deployed yet)
    location ^~ /capi/ {
        limit_req zone=burst burst=30 nodelay;
        limit_req zone=sustained burst=60 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $capi_upstream http://gmr-community-api.${POD_NAMESPACE}.svc.cluster.local:8001;
        rewrite ^/capi/(.*)$ /$1 break;
        proxy_pass $capi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support for /assist/chat/stream
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Consolidator proxy — singleton in gmr ns, shared across envs.
    # Must come before /api/ because /api/consolidator/ is more specific.
    location ^~ /api/consolidator/ {
        limit_req zone=burst burst=30 nodelay;
        limit_req zone=sustained burst=60 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $consolidator_upstream http://gmr-consolidator.gmr.svc.cluster.local:8000;
        rewrite ^/api/consolidator/(.*)$ /$1 break;
        proxy_pass $consolidator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap — served by the community API, but we want it at the
    # site root (`/sitemap.xml`) for crawlers, not under `/capi/`.
    # robots.txt sits on disk (public/) so nginx serves it as a static
    # file without needing its own location block.
    location ~ ^/sitemap(?:-[a-z]+)?\.xml$ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $capi_upstream http://gmr-community-api.${POD_NAMESPACE}.svc.cluster.local:8001;
        proxy_pass $capi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GMR API proxy — strip /api prefix before forwarding
    location ^~ /api/ {
        limit_req zone=burst burst=30 nodelay;
        limit_req zone=sustained burst=60 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $api_upstream http://gmr-api.${POD_NAMESPACE}.svc.cluster.local;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Image uploads — proxy to MinIO
    location ^~ /uploads/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $minio_upstream http://minio.${POD_NAMESPACE}.svc.cluster.local:9000;
        rewrite ^/uploads/(.*)$ /gmr-uploads/$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeat security headers: any location with its own add_header
        # loses server-level `add_header` inheritance in nginx.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Prerender-aware routing: prefer a route-specific prerendered
    # HTML (dist/client/privacy/index.html, dist/client/feed/index.html, …)
    # before falling back to the SPA shell. `$uri/index.html` handles the
    # build-time prerendered pages; plain `/index.html` handles any route
    # Vue Router owns on the client.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Umami event tracking endpoint
    location ^~ /umami/api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/umami/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeat security headers: any location with its own add_header
        # loses server-level `add_header` inheritance in nginx.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
