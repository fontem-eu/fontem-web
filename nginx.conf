server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static pages under /admin — served directly, not through Vue Router
    location ^~ /admin/plan {
        try_files $uri $uri/ =404;
    }

    # SPA fallback: any path that isn't a real file is served as index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Umami through the same origin so the tracking script and event
    # endpoint are reachable from any browser without VPN access.
    # /umami/script.js  → Umami JS bundle
    # /umami/api/send   → event ingestion endpoint (auto-used by Umami script)
    # Proxy only the Umami event ingestion endpoint through the same origin
    # so browsers can reach it without VPN access.
    # rewrite strips /umami/ prefix before proxy_pass (required when using a
    # variable — nginx skips automatic prefix stripping in that case).
    location ^~ /umami/api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/umami/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Analytics dashboard — reverse proxy to Umami
    # Umami (Next.js) uses /_next/, /api/, /share/, /favicon.ico etc.
    # We proxy the entry point AND all Umami sub-paths.
    location ^~ /admin/analytics/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/admin/analytics/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        # Rewrite absolute paths in HTML/JS to go through the proxy
        sub_filter_types text/html application/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/admin/analytics/';
        sub_filter 'src="/' 'src="/admin/analytics/';
        sub_filter '"/_next/' '"/admin/analytics/_next/';
        sub_filter '"/api/' '"/admin/analytics/api/';
        sub_filter '"/share/' '"/admin/analytics/share/';
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
