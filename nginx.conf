server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: any path that isn't a real file is served as index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
