server {
    listen       8080;
    server_name  _;

    # Hide nginx version from Server header
    server_tokens off;

    # One hostname, permanently. robots.txt, the sitemap and the baked
    # canonical all publish apex; www resolved too and answered 200, so
    # the same page existed at two URLs with a canonical pointing at a
    # third combination. Redirect rather than canonical-only so the
    # duplicate stops being fetchable at all.
    #
    # `if` in server context for a host test is the documented-safe use
    # (the "if is evil" warning is about location context).
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security headers — single source: snippets/security-headers.conf.
    # Pulled in here AND in every location that sets its own add_header,
    # because nginx drops inherited add_header once a location adds any.
    include /etc/nginx/snippets/security-headers.conf;

    # Reject HTTP methods we don't expose (TRACE, CONNECT, TRACK, PROPFIND…)
    # with a 405 *carrying an Allow header* — RFC 9110 §15.5.6 makes the
    # header mandatory and schemathesis's DAST run flagged its absence on
    # every route. nginx handles this at the server level so the upstream
    # never sees these methods. The named-location dance is the only way
    # to set add_header on a 405 — `add_header` in `if {}` is silently
    # dropped by nginx for non-2xx/3xx responses unless wrapped this way.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405;
    }
    error_page 405 = @method_not_allowed;

    location @method_not_allowed {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Allow "GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS" always;
        return 405 "405 Method Not Allowed\n";
    }

    # Self-identifying rate limits. Four layers on the request path can
    # 429 (this nginx, Linkerd's policy, slowapi in the APIs, upstreams);
    # the STORY-FLOWERS-3 triage burned time working out WHICH. The marker
    # header names this one, and Retry-After gives the SPA's retry wrapper
    # its cue. Same named-location dance as the 405 above — add_header on
    # a non-2xx/3xx needs it.
    error_page 429 = @rate_limited;

    location @rate_limited {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Ratelimited-By "fontem-web-nginx" always;
        add_header Retry-After "2" always;
        default_type application/json;
        return 429 '{"error": "rate_limited", "retry_after_s": 2}';
    }

    # The scripted e2e model is cluster-internal. It is mounted only where
    # ASSIST_MOCK_MODEL is set (testing and staging), and its only caller is
    # the community-api pod's own assistant turn, over the service address.
    # Without this block /capi/ would proxy it straight to the internet:
    # an unauthenticated POST endpoint, on a public host, in two
    # environments — verified reachable before this was added, so this is a
    # fix and not a precaution.
    #
    # 404 rather than 403: outside the cluster the endpoint genuinely does
    # not exist, and saying "forbidden" would advertise that it does.
    # Placed above /capi/ because ^~ matches the longest prefix first.
    location ^~ /capi/mock-llm {
        return 404;
    }

    # Community API proxy (resolver makes upstream resolution happen at request time,
    # not at startup — so nginx starts even if community-api isn't deployed yet)
    location ^~ /capi/ {
        limit_req zone=burst burst=100 nodelay;
        limit_req zone=sustained burst=200 nodelay;

        # Uploads (avatars, story images) go through /capi. The backend
        # file_security pipeline caps rasters at 20 MB (MAX_RASTER_BYTES) —
        # sized for modern phone photos — so allow a hair over that here and
        # let the app return a friendly 400 rather than nginx's raw 413.
        client_max_body_size 21m;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $capi_upstream http://fontem-community-api.${POD_NAMESPACE}.svc.cluster.local:8001;
        rewrite ^/capi/(.*)$ /$1 break;
        # De-dupe: the community-api sets these too; hide its copies so the
        # single-source security-headers.conf (inherited here) adds them once.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_pass $capi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support for /assist/chat/stream
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # MCP endpoint — external LLM clients (Claude Desktop, Claude Code,
    # ChatGPT) connect here with a Fontem personal access token and call
    # our tools on their own subscription. See /help.
    #
    # No path rewrite: the server serves /mcp directly, and rewriting
    # would only give us two places to keep in step.
    location ^~ /mcp {
        limit_req zone=burst burst=100 nodelay;
        limit_req zone=sustained burst=200 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $mcp_upstream http://fontem-mcp.${POD_NAMESPACE}.svc.cluster.local:8091;
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP is long-lived and server-pushed: buffering would
        # hold responses until the connection closed, which for a
        # streaming transport means never.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # Consolidator proxy — singleton in gmr ns, shared across envs.
    # Must come before /api/ because /api/consolidator/ is more specific.
    location ^~ /api/consolidator/ {
        limit_req zone=burst burst=100 nodelay;
        limit_req zone=sustained burst=200 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $consolidator_upstream http://fontem-consolidator.fontem-shared.svc.cluster.local:8000;
        rewrite ^/api/consolidator/(.*)$ /$1 break;
        proxy_pass $consolidator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemap — served by the community API, but we want it at the
    # site root (`/sitemap.xml`) for crawlers, not under `/capi/`.
    # robots.txt sits on disk (public/) so nginx serves it as a static
    # file without needing its own location block.
    # Entity shards come from fontem-api, which owns the graph the
    # rankings are computed from. Matched BEFORE the community-API
    # sitemap block below, which is deliberately narrower now: a
    # trailing `-<ALPHA3>` is what distinguishes them.
    # Quoted, because the regex contains braces. nginx parses `{` as a
    # block delimiter before it parses the regex, so an unquoted {3}
    # aborts startup with `unknown directive "3}\.xml$"` — which the
    # smoke job catches by booting the real config.
    location ~ "^/sitemap-(?:companies|authorities)-[A-Z]{3}\.xml$" {
        resolver 10.43.0.10 valid=30s ipv6=off;
        # No port: the fontem-api Service listens on 80 in every
        # environment, same as the /api/ proxy below. Hardcoding :8000
        # here made every advertised company shard 502 in production —
        # 32 URLs in the sitemap index, all dead.
        set $gmr_sitemap http://fontem-api.${POD_NAMESPACE}.svc.cluster.local;
        proxy_pass $gmr_sitemap;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }

    location ~ ^/sitemap(?:-[a-z]+)?\.xml$ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $capi_upstream http://fontem-community-api.${POD_NAMESPACE}.svc.cluster.local:8001;
        proxy_pass $capi_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GMR API proxy — strip /api prefix before forwarding
    # Longer than fontem-api's own 60s SPARQL ceiling, on purpose.
    #
    # Without this, nginx used its 60s default — the same 60s the API waits
    # before returning a legible `{"detail": "SPARQL query exceeded the
    # configured timeout"}` with a 504. The two raced, nginx won, and the
    # user got an HTML "504 Gateway Time-out" page instead of the message
    # the API had gone to the trouble of composing. Measured: the editor's
    # store-inventory example returns nginx HTML at exactly 60s.
    #
    # 90s gives the API room to answer for itself. It does not make slow
    # queries fast; it makes them explicable.
    location ^~ /api/ {
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        limit_req zone=burst burst=100 nodelay;
        limit_req zone=sustained burst=200 nodelay;

        resolver 10.43.0.10 valid=30s ipv6=off;
        set $api_upstream http://fontem-api.${POD_NAMESPACE}.svc.cluster.local;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Image fetches — community-api hands the browser an absolute
    # presigned URL (e.g. /${MINIO_BUCKET}/<key>?X-Amz-Signature=…),
    # and the browser hits us here. We proxy straight through to
    # MinIO with the Host header intact; the AWS-SigV4 signature is
    # bound to the host + path + query string, so any rewrite breaks
    # validation. The bucket itself is private — un-signed reads
    # against this path 403, which is exactly what we want for any
    # stale /uploads/<key> link that escaped into the wild before
    # the rotation.
    #
    # No `expires` / `Cache-Control` set here: presigned URLs include
    # an X-Amz-Date + X-Amz-Expires pair and MinIO answers with
    # appropriate caching headers itself. Adding our own would
    # potentially over-cache a URL past its signed window.
    location ^~ /${MINIO_BUCKET}/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $minio_upstream http://minio.${MINIO_NAMESPACE}.svc.cluster.local:9000;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Public media (the /development walkthrough video + its poster),
    # served anonymously from the env's MinIO bucket under the public-read
    # `media/` prefix. Kept distinct from the presigned /${MINIO_BUCKET}/
    # path: these objects carry an anonymous download policy, so no
    # signature is needed — which keeps the 24 MB video out of the repo
    # and the image.
    location ^~ /media/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $minio_media http://minio.${MINIO_NAMESPACE}.svc.cluster.local:9000;
        rewrite ^/media/(.*)$ /${MINIO_BUCKET}/media/$1 break;
        proxy_pass $minio_media;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Legacy /uploads/<key> path: held open during the pre-presigned-
    # URL era when nginx anonymously proxied the bucket. The new
    # contract is "the stored doc still references /uploads/<key> as
    # a stable internal handle, but the API rewrites every response
    # to a presigned URL on the /${MINIO_BUCKET}/ path." Anything
    # still hitting /uploads/ is a cached/escaped link from before
    # the cutover — 404 cleanly so it's obvious in the logs.
    location ^~ /uploads/ {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 404 "Image links must be re-fetched after the 2026-06-13 presigned-URL migration.";
    }

    # Prerender-aware routing: prefer a route-specific prerendered
    # HTML (dist/client/privacy/index.html, dist/client/feed/index.html, …)
    # before falling back to the SPA shell. `$uri/index.html` handles the
    # build-time prerendered pages; `/spa.html` handles any route Vue
    # Router owns on the client.
    #
    # /spa.html, NOT /index.html. index.html is the prerendered HOMEPAGE,
    # so falling back to it made every unrendered route — every story,
    # every company, every contract — serve the homepage's title,
    # description, JSON-LD and canonical. A canonical of `/` on
    # /stories/<id> tells Google that page IS the homepage, which is an
    # instruction not to index it, while sitemap-stories.xml was
    # submitting those very URLs. spa.html carries the site defaults and
    # no canonical at all, so Google falls back to the request URL.
    # Data stories render per request, because a story is published
    # minutes after a deploy and cannot be baked into a static file.
    # This is the only route that needs a Node runtime; everything else
    # stays static, which is why the SSR service is a separate
    # deployment rather than a second process in this hardened image.
    #
    # Fail-safe in both directions. No SSR service configured in this
    # environment -> serve the shell, which is what these routes did
    # before SSR existed. SSR configured but unhealthy -> the same,
    # via proxy_intercept_errors. A story page must never 502 because
    # a rendering optimisation is down.
    location ~ ^/stories/[^/]+$ {
        # A variable proxy_pass defers name resolution to request time,
        # which needs an explicit resolver — same as the sitemap block
        # above. It also means nginx starts even when the SSR service
        # does not exist yet, instead of failing to boot on an
        # unresolvable upstream.
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $ssr_upstream "${SSR_UPSTREAM}";
        if ($ssr_upstream = "") {
            rewrite ^ /spa.html last;
        }
        proxy_pass $ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_shell;
    }

    location @spa_shell {
        try_files /spa.html =404;
    }

    location / {
        try_files $uri $uri/index.html /spa.html;

        # The SPA shell and the prerendered pages carry whatever the logged-in
        # user is looking at once Vue hydrates, so they must not sit in a
        # shared cache. Flagged by ZAP as "Re-examine Cache-control
        # Directives" on every HTML response; the hashed bundles under
        # /assets/ keep their immutable year, which is where caching actually
        # pays.
        #
        # The re-include is not redundant: nginx drops every inherited
        # add_header the moment a location sets one of its own, which is the
        # exact trap documented at the top of security-headers.conf.
        # The full directive set, not just no-store: ZAP's rule 10015 keeps
        # flagging responses that carry no-store alone, and the extra
        # directives are what older intermediaries actually honour.
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Umami event tracking endpoint
    #
    # Umami's IP detection reads X-Real-IP first, falls back to
    # X-Forwarded-For. In our path the request arrives here as:
    #   bastion (frps: adds 172.17.0.x to XFF) -> frpc (in-cluster)
    #   -> Traefik -> this nginx.
    # Old logic tried to "pass through the bastion's X-Real-IP" but
    # (a) the frps tunnel doesn't reliably preserve that header, and
    # (b) the `if`+`set` idiom inside a location block hits nginx's
    # famous "if is evil" bug — the variable often reads back as
    # uninitialized. Result: nginx sent X-Real-IP empty, Umami fell
    # back to XFF, saw 172.17.0.2 (in Umami's IGNORE_IP=172.17.0.0/16
    # range), and rejected with 403.
    #
    # Fix: use nginx's real_ip module to extract the actual client IP
    # from the XFF chain (trusting Traefik + frpc + the bastion as
    # proxies), then forward that as X-Real-IP.
    location ^~ /umami/api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        # Trust the in-cluster proxies + the bastion tunnel egress
        # range so real_ip walks past them to the real client.
        set_real_ip_from 10.42.0.0/16;
        set_real_ip_from 172.17.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        rewrite ^/umami/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        # $remote_addr is now the real client (after real_ip walked
        # the XFF chain). Umami reads this from X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    # Vite fingerprints everything under /assets/ (content hash in the
    # filename), so those are safe to cache forever.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Root-level static keeps STABLE names (favicon, PWA icons, manifest,
    # og-card, umami-config). Marking these immutable froze the PWA
    # install icons for a year, so a new mark never reached installed
    # apps. Revalidate instead — a 304 when unchanged is cheap, and a
    # changed icon (or a renamed one) propagates immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
