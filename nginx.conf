server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Static pages under /admin — served directly, not through Vue Router
    location ^~ /admin/plan {
        try_files $uri $uri/ =404;
    }

    # ── Umami analytics proxy ────────────────────────────────────
    # Umami (Next.js) is proxied at /admin/analytics/. But Next.js
    # also makes requests to bare /_next/, /api/send, /share/ etc.
    # We proxy all of these to Umami so the dashboard works in an iframe.

    location ^~ /admin/analytics/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/admin/analytics/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Next.js runtime assets — proxy to Umami
    location ^~ /_next/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Umami share pages
    location ^~ /share/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    # Umami event tracking endpoint (existing)
    location ^~ /umami/api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        rewrite ^/umami/(.*)$ /$1 break;
        proxy_pass http://umami.monitoring.svc.cluster.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SPA fallback ─────────────────────────────────────────────
    # Any path that isn't a real file or proxied above → Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
