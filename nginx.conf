server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: any path that isn't a real file is served as index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Umami through the same origin so the tracking script and event
    # endpoint are reachable from any browser without VPN access.
    # /umami/script.js  → Umami JS bundle
    # /umami/api/send   → event ingestion endpoint (auto-used by Umami script)
    location /umami/ {
        # k8s cluster DNS — required for nginx to resolve in-cluster hostnames
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $umami_upstream http://umami.monitoring.svc.cluster.local;
        proxy_pass $umami_upstream/;
        proxy_set_header Host analytics.void42.internal;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standard cache headers for hashed assets
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
