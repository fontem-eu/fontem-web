sonar.projectKey=gmr-web
sonar.projectName=gmr-web
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**

# Vitest istanbul lcov output
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files excluded from analysis entirely (not measured for issues or coverage).
# Vue views are too tightly coupled to the DOM/D3/external APIs to test
# meaningfully in jsdom — covered by Playwright e2e instead.
sonar.exclusions=\
  src/views/**,\
  src/data/**,\
  src/main.js,\
  src/App.vue,\
  src/components/ShareModal.vue,\
  src/components/IssueCreateModal.vue,\
  src/components/ProfilePanel.vue,\
  src/components/GraphExplorer.vue,\
  src/components/QueryEditor.vue,\
  src/components/StudioMap.vue,\
  src/components/GeoChoropleth.vue,\
  src/components/AssistPanel.vue,\
  src/widgets/**

# Files excluded from coverage requirements only (still analyzed for code smells).
# These have logic that's exercised by integration tests but not unit tests.
sonar.coverage.exclusions=\
  src/views/**,\
  src/data/**,\
  src/main.js,\
  src/App.vue,\
  src/components/ShareModal.vue,\
  src/components/IssueCreateModal.vue,\
  src/components/ProfilePanel.vue,\
  src/components/GraphExplorer.vue,\
  src/components/QueryEditor.vue,\
  src/components/StudioMap.vue,\
  src/components/GeoChoropleth.vue,\
  src/components/AssistPanel.vue,\
  src/widgets/**,\
  src/api/**,\
  src/composables/**,\
  src/router/**,\
  src/components/charts/**,\
  src/components/SummaryPanel.vue,\
  src/components/TickerFinancials.vue,\
  src/components/RailIcon.vue
